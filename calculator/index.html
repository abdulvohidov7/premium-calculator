<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="calculator">

    <div class="header">
        <span>CALCULATOR</span>
        <button id="historyBtn">☰</button>
    </div>

    <div class="display">
        <div id="previous"></div>
        <div id="current">0</div>
    </div>

    <div class="buttons">

        <button class="clear" data-action="clear">AC</button>
        <button data-action="delete">⌫</button>
        <button data-action="percent">%</button>
        <button class="operator" data-value="/">÷</button>

        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button class="operator" data-value="*">×</button>

        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button class="operator" data-value="-">−</button>

        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button class="operator" data-value="+">+</button>

        <button data-action="sign">±</button>
        <button data-value="0">0</button>
        <button data-value=".">.</button>
        <button class="equal" data-action="equals">=</button>

    </div>

    <div class="history" id="history">
        <div class="history-top">
            <h2>History</h2>
            <button id="closeHistory">×</button>
        </div>

        <div id="historyList">
            <p>Hozircha tarix yo‘q</p>
        </div>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
